services:
  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --appendonly yes
    volumes: [valkey-data:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      PORT: 4000
      CLIENT_URL: http://localhost:8080
      VALKEY_URL: redis://valkey:6379
      ROOM_TTL: 86400
    ports: ["4000:4000"]
    depends_on:
      valkey: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      args: { VITE_SERVER_URL: "http://localhost:4000" }
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  valkey-data:

